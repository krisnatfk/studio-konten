<!doctype html><html lang="id"><meta charset="utf-8"><title>Preview adegan</title><style>body{background:#151218;color:#e3d3ba;font:16px system-ui;margin:0;text-align:center}a{color:#d2ae75}header{padding:12px}#box{width:min(90vw,480px);aspect-ratio:9/16;margin:auto;overflow:hidden;position:relative}iframe{width:1080px;height:1920px;border:0;position:absolute;left:0;top:0;transform-origin:top left}footer{padding:16px}input{width:min(60vw,360px)}button{padding:10px;margin:8px;background:#66503a;color:white;border:0;border-radius:6px}</style><header><a href="/library">← Pustaka</a> · <span id="name"></span></header><div id="box"><iframe id="frame" src="__SOURCE__"></iframe></div><footer><button id="play">Putar</button><input id="time" aria-label="Waktu animasi" type="range" min="0" max="6" step="0.01" value="0"><span id="seconds">0.00s</span></footer><script>
const f=document.querySelector('#frame'),range=document.querySelector('#time'),button=document.querySelector('#play');let playing=false,last=0,busy=false;
function resize(){f.style.transform=`scale(${document.querySelector('#box').clientWidth/1080})`}window.onresize=resize;resize();
async function draw(t){if(busy||!f.contentWindow.render)return;busy=true;try{await f.contentWindow.render(t);range.value=t;document.querySelector('#seconds').textContent=t.toFixed(2)+'s'}finally{busy=false}}
f.onload=()=>{document.querySelector('#name').textContent=location.pathname.split('/').pop().replaceAll('_',' ');draw(.1)};button.onclick=()=>{playing=!playing;button.textContent=playing?'Jeda':'Putar';last=performance.now()};range.oninput=()=>{playing=false;button.textContent='Putar';draw(+range.value)};
async function tick(now){if(playing&&!busy){const dt=(now-last)/1000;last=now;await draw((+range.value+dt)%6)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
