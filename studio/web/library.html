<!doctype html><html lang="id"><meta charset="utf-8"><title>Pustaka Horor Kampung</title><style>body{margin:0;background:#100f12;color:#e9d9be;font:16px system-ui}header{position:sticky;top:0;background:#17151a;padding:20px;z-index:1}a{color:#d9ab69}input,select{padding:10px;background:#29242a;color:inherit;border:1px solid #705942;border-radius:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:24px}article{background:#211b20;border:1px solid #4a3930;border-radius:12px;padding:16px}video{width:100%;max-height:320px;background:#09080a}small{color:#bba789}details{margin-top:12px}h1{font-size:24px}code{word-break:break-word}</style><header><a href="/">← Studio</a><h1>Pustaka Horor Kampung · 120 adegan</h1><input id="q" placeholder="Cari aktivitas atau aset…"><select id="category"><option value="">Semua kategori</option></select><select id="era"><option value="">Semua era</option><option value="modern">Masa kini</option><option value="any">Lintas era</option></select><span id="count"></span></header><main id="cards"></main><script>
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let data;
function draw(){const q=document.querySelector('#q').value.toLowerCase(),cat=document.querySelector('#category').value,era=document.querySelector('#era').value;const rows=data.templates.filter(r=>(!cat||r.category===cat)&&(!era||r.era===era)&&JSON.stringify(r).toLowerCase().includes(q));document.querySelector('#count').textContent=' '+rows.length+' adegan';document.querySelector('#cards').innerHTML=rows.map(r=>`<article><video controls preload="none" poster="/library/files/${r.id}/thumb.jpg" src="/library/files/${r.id}/demo.mp4"></video><h2>${esc(r.label)}</h2><small>${esc(r.category)} · ${esc(r.era)} · ${r.verified?'Referensi terverifikasi':'Referensi draft'}</small><p>${esc(r.description)}</p>${r.evaluation?`<p><small>Review ${esc(r.evaluation.score??'belum lengkap')}/10${r.evaluation.technical_issues?.length?' · kontak/tata letak perlu diperbaiki':''}</small></p>`:''}<details><summary>Aset dan referensi</summary><p>${(r.assets||[]).map(a=>`<a href="/library/asset/${esc(a)}" target="_blank">${esc(a)}</a>`).join(', ')}</p>${r.references.map(x=>`<p>${esc(x.text)} <small>${esc(x.status||'contoh negatif')}</small></p>`).join('')}<a href="/library/preview/${r.id}" target="_blank">Preview interaktif</a><p><code>${esc(r.id)}</code></p></details></article>`).join('')}
fetch('/api/library').then(r=>r.json()).then(d=>{data=d;document.querySelector('#category').innerHTML+=[...new Set(d.templates.map(r=>r.category))].map(c=>`<option>${esc(c)}</option>`).join('');draw()});document.querySelectorAll('input,select').forEach(e=>e.oninput=draw);
</script></html>
